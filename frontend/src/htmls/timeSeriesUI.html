<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/src_frontend/styles/plotChart.css?v=004">
</head>
<body>
    <!-- Plot window -->
    <div id="plotWindow">
      <div class="plot-controls">
          <label for="select-object">Select:</label>
              <div class="select-object">
              <div class="select-box">
                  <span class="label-text">Select one or more options</span>
                  <span class="arrow">▼</span>
              </div>
              <div class="checkbox-list"></div>
          </div>
          <div class="button-group">
              <button type="button" id="viewDataBtn">View Data</button>
              <button type="button" id="downloadExcel">Download as Excel File</button>                
          </div>
      </div>
      <div class="plot-area">
          <div id="myChart"></div>
      </div>
    </div>
    <script src="https://cdn.plot.ly/plotly-2.26.1.min.js"></script>
    <script type="module" src="/src_frontend/services/chartManager.js"></script>
</body>
</html>
