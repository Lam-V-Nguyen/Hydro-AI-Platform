<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="/src_frontend/styles/tabControler.css?v=0">
    <link rel="stylesheet" href="/src_frontend/styles/flowPreparation.css?v=1">
</head>
<body>
    <div class="wrapper">
        <section class="main-tab" id="control-tab">
            <div class="tab-header" id="main-tabs">
                <div class="tabs-list">
                    <button class="tab-btn" data-tab="settings-tab">Settings</button>
                    <button class="tab-btn" data-tab="terrain-tab">Topography</button>
                    <button class="tab-btn" data-tab="soil-tab">Soil</button>
                    <button class="tab-btn" data-tab="land-tab">Land Cover</button>
                    <button class="tab-btn" data-tab="river-network-tab">River Network</button>
                    <!-- <button class="tab-btn" data-tab="weather-data-tab">Weather Data</button>
                     -->
                </div>
            </div>
            <div class="tabs-content">
                <!-- Tab 1: Settings -->
                <div class="tabpanel main-panel" data-panel="settings-tab">
                    <div class="grid">
                        <div class="tile"><h3>Project</h3>
                            <div class="row">
                                <div class="field-inline">
                                    <label for="project-name">Scenario</label>
                                    <div id="project-name-wrapper">
                                        <input type="text" id="project-name" placeholder="Enter scenario's name">
                                        <ul id="project-list"></ul>
                                    </div>
                                    <button id="create-btn">Create/Open</button>
                                </div>
                                
                                

                                
                            </div>
                            
                            
                             
                        </div>
                        <div class="tile initial-conditions-tile" style="grid-column: span 8;"><h3>Initial Conditions</h3>
                            <div class="single-row">
                                <label for="initial-top-moisture">Top soil moisture (m³/m³):</label>
                                <input type="text" id="initial-top-moisture" value='0.25'>
                            </div>
                            <div class="single-row">
                                <label for="initial-sub-moisture">Sub soil moisture (m³/m³):</label>
                                <input type="text" id="initial-sub-moisture" value='0.30'>
                            </div>
                            <div class="single-row">
                                <label for="initial-groundwater">Groundwater level (mm):</label>
                                <input type="text" id="initial-groundwater" value='50'>
                            </div>
                            <div class="single-row">
                                <label for="initial-overland-flow">Overland flow (mm):</label>
                                <input type="text" id="initial-overland-flow" value='0'>
                            </div>
                            <div class="single-row">
                                <label for="initial-river-storage">River/Channel storage (mm):</label>
                                <input type="text" id="initial-river-storage" value='0'>
                            </div>
                            <div class="single-row">
                                <label for="initial-lake-storage">Lake storage (mm):</label>
                                <input type="text" id="initial-lake-storage" value='500'>
                            </div>
                            <div class="single-row">
                                <label for="initial-snow-depth">Initial snow depth (mm):</label>
                                <input type="text" id="initial-snow-depth" value='0'>
                            </div>
                            <div class="single-row">
                                <label for="initial-water-depth">Initial water depth (mm) or discharge (m³/s):</label>
                                <input type="text" id="initial-water-depth" value='0'>
                            </div>
                            <div class="single-row">
                                <label for="initial-saturation-deficit">Saturation deficit (mm):</label>
                                <input type="text" id="initial-saturation-deficit" value='100'>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Tab 2: Topography -->
                <div class="tabpanel main-panel" data-panel="terrain-tab">
                    <div class="grid">
                        <div class="tile"><h3>Terrain Import</h3>
                            <div class="row" style="white-space: nowrap;">
                                <label for="terrain-input">Raw Terrain:</label>
                                <input type="file" id="terrain-input-file" accept=".tif" hidden>
                                <input type="file" id="catchment-input-file" accept=".geojson" hidden>
                                <input type="text" id="terrain-input-text" placeholder="No file selected" readonly>
                                <button type="button" id="terrain-btn" style="min-width: 100px;">Select File (*.tif)</button>
                            </div>
                            <div class="row">
                                <div class="row-radio" data-tab="terrain">
                                    <input type="radio" id="terrain-raw" name="terrain" value="terrain-raw">
                                    <label for="terrain-raw">Show Terrain</label>
                                </div>
                                <div class="row-radio" data-tab="terrain">
                                    <input type="radio" id="hide-all" name="terrain" value="hide-all" checked=true>
                                    <label for="hide-all">Hide All</label>
                                </div>

                            </div>
                        </div>
                        <div class="tile"><h3>Terrain Processing</h3>
                            <div class="row">
                                <div class="field-inline">
                                    <label for="threshold">Threshold:</label>
                                    <input type="text" id="threshold" value="50.0" style="max-width: 100px;">
                                    <label>(m)</label>
                                    <button style="margin: 0 10px 0 10px;" type="button" id="stream-btn">1. Extract Streams</button>
                                    <div class="row-radio" data-tab="terrain">
                                        <input type="radio" id="terrain-stream" name="terrain" value="terrain-stream">
                                        <label for="terrain-stream">Show Layer</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="tile"><h3>Catchment Delineation</h3>
                            <div class="row pourpoint-container" style="margin-top: -10px;">
                                <div class="row-radio" data-tab="terrain">
                                    <div class="field-inline" style="width: 220px;">
                                        <label>Snap distance:</label>
                                        <input type="text" id="pourpoint-dist" value="10.0">
                                        <label>(m)</label>
                                    </div>
                                    <input type="checkbox" id="pourpoint-checkbox">
                                    <label for="pourpoint-checkbox" style="flex-wrap: wrap;">
                                        4. Select Pour point
                                    </label>
                                </div>
                                <div class="pourpoint-group" id="pourpoint-container" style="display: none;">
                                    <div class="field-inline" style="margin-top: -10px;">
                                        <input type="text" id="pourpoint-lat" placeholder="Latitude" readonly>
                                        <input type="text" id="pourpoint-lon" placeholder="Longitude" readonly>
                                        <div class="row-radio" data-tab="terrain">
                                            <input type="radio" id="catchment-layer" name="terrain" value="terrain-catchment">
                                            <label for="catchment-layer">Show Catchment</label>
                                        </div>
                                        <button type="button" id="export-catchment-btn" style="max-width: 100px;"> Export </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Tab 2: Soil Properties -->
                <div class="tabpanel main-panel" data-panel="soil-tab">
                    <div class="grid">
                        <div class="tile"><h3>Data Import and Download</h3>
                            <div class="row">
                                <label>Upload a Catchment to define the area:</label>
                                <button type="button" id="soil-btn" style="min-width: 100px;">Upload a Catchment (*.geojson)</button>
                            </div>
                            <div class="row">
                                <label for="soil-source">Soil Data Source:</label>
                                <select id="soil-source">
                                    <option value="" selected>--- Select a source ---</option>
                                    <option value="isric">World Soil Information - ISRIC - 250m</option>
                                </select>
                            </div>
                            <div class="row" id="soil-container" style="display: none;">
                                <button type="button" id="download-soil-btn" 
                                style="min-width: 100px; margin: 20px;">Download Soil Data</button>
                                <button type="button" id="save-soil-btn" 
                                style="min-width: 100px; margin: 20px;">Save Soil Data</button>
                            </div>
                        </div>
                        <div class="tile"><h3>Attribute Table</h3>
                            <div class="table-container">
                                <table class="attributes-table" id="soil-attributes-table">
                                    <thead><tr>
                                        <th>Soil Type</th><th>Depth (cm)</th><th>Value</th>
                                    <tbody>
                                        <tr>
                                            <td><input type="text" placeholder="Soil type"></td>
                                            <td><input type="text" placeholder="Soil depth"></td>
                                            <td><input type="text" placeholder="Value"></td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

                        </div>

                    </div>

                <!-- Tab 4: River Network -->
                <div class="tabpanel main-panel" data-panel="river-network-tab">
                    <div class="grid">
                        <div class="tile"><h3>River Import</h3>
                            <div class="row-radio">
                                <input type="radio" name="river" value="river-vector" id="river-vector" checked>
                                <label for="river-vector">Upload River (Vector)</label>
                                <input type="radio" name="river" value="river-raster" id="river-raster">
                                <label for="river-raster">Use Flow Accumulation (Raster)</label>
                            </div>
                            <div class="row">
                                <div class="row" id="river-container" style="width: 250px; display: none;">
                                    <label for="river-threshold" id="river-threshold-label">Threshold:</label>
                                    <input type="text" id="river-threshold" value="1000.0" style="width: 50px;">
                                </div>
                                <input type="file" id="river-input-file" accept=".tif,.geojson" hidden>
                                <button type="button" id="river-upload-btn" style="min-width: 50px;">Select File (*.tif, *.geojson)</button>
                            </div>
                            <div class="row">
                                <label for="river-input-text">River Data:</label>
                                <input type="text" id="river-input-text" placeholder="No file selected" readonly>
                            </div>
                        </div>
                        <div class="tile"><h3>River Processing</h3>
                            <div class="row">
                                <input type="file" id="lake-input-file" accept=".geojson" hidden>
                                <button type="button" id="lake-upload-btn">Upload Lake Boundary</button>
                                <button type="button" id="lake-catchment-upload-btn">Upload Catchment Boundary</button>
                            </div>
                            <div class="row">
                                <button type="button" id="river-clip-lake-btn">Clip River to Lake</button>
                                <button type="button" id="river-clip-catchment-btn">Clip River to Catchment</button>
                            </div>
                            <div class="radio-button">
                                <label class="row-radio">
                                    <input type="checkbox" id="river-checker-checkbox">Show/Hide River Layer
                                </label>
                                <div class="row">
                                    <button type="button" id="river-invalid-checker-btn" style="display: block; width: 300px;">
                                        Check invalid river segments
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="tile" style="grid-column: span 8;"><h3>Attribute Table</h3>
                            <div class="row">
                                <label for="river-id">Selected segment:</label>
                                <select style="min-width: 100px; margin-right: 50px;" id="river-id"></select>
                                <button type="button" id="river-delete-btn" 
                                    style="background-color: azure; color: brown; max-width: 300px;">
                                    Delete the selected segment
                                </button>
                                <button type="button" id="river-assign-btn" style="max-width: 200px;">
                                    Save selected Attributes
                                </button>
                                <button type="button" id="river-save-btn" style="max-width: 100px;">
                                    Export
                                </button>
                            </div>
                            <div class="table-container">
                                <table class="attributes-table" id="river-table">
                                    <thead><tr>
                                        <th>Segment</th><th>Width (m)</th><th>Depth (m)</th>
                                    </tr></thead>
                                    <tbody>
                                        <tr>
                                            <td><input type="text" placeholder="Segment ID"></td>
                                            <td><input type="text" placeholder="Width"></td>
                                            <td><input type="text" placeholder="Depth"></td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

        </section>
    </div>
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script>
        flatpickr(".datetime", {
            enableTime: true, enableSeconds: true, dateFormat: "Y-m-d H:i:S", time_24hr: true,
            defaultHour: 0, defaultMinute: 0, defaultSecond: 0
        });
    </script>

</body>
