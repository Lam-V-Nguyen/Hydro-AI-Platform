meta:
  root: None

corine:
  uri: data/landcover/corine.tif
  driver:
    options: {}
    name: rasterio
  metadata:
    category: landuse & landcover
    author: Copernicus / European Environment Agency
    info: landuse parameters based on corine classification for Europe
    resolution: 100m
    url: https://land.copernicus.eu/en/products/corine-land-cover
  data_type: RasterDataset
  root: None

corine_mapping:
  uri: data/landcover/corine.csv
  driver:
    name: pandas
  metadata:
    category: landuse & landcover
    version: 1.0
    legend: https://image.discomap.eea.europa.eu/arcgis/rest/services/Corine/CLC2018_WM/MapServer/legend
  data_type: DataFrame
  root: None

dtm:
  uri: data/hydro/elevtn.tif
  driver:
    options: {}
    name: rasterio
  metadata:
    category: topography
  data_type: RasterDataset
  root: None

lai_mapping:
  uri: data/landcover/lai.csv
  driver:
    name: pandas
  metadata:
    category: landuse & landcover
  data_type: DataFrame
  root: None

my_hydro:
  uri: data/hydro/{variable}.tif
  driver:
    options: {}
    name: rasterio
  metadata:
    category: hydrology
  data_type: RasterDataset
  root: None

river_manning_mapping:
  uri: data/river/river_manning.csv
  driver:
    name: pandas
  metadata:
    category: river
    description: Mapping of stream order to Manning's n roughness coefficient, based
      on Chow (1959) and Dingman (2015)
  data_type: DataFrame
  root: None

river_network:
  uri: data/river/river.gpkg
  driver:
    name: pyogrio
  metadata:
    category: river
  data_type: GeoDataFrame
  root: None

soilgrids:
  uri: data/soil/{variable}.tif
  driver:
    options: {}
    name: rasterio
  metadata:
    category: soil
    url_2017: https://files.isric.org/soilgrids/former/2017-03-10/data/
    url_2020: https://files.isric.org/soilgrids/latest/data/
  data_type: RasterDataset
  root: None

weather_forcing:
  uri: data/forcing/weather_forcing.nc
  driver:
    options: {}
    name: raster_xarray
  metadata:
    category: meteo
  data_type: RasterDataset
  root: None
