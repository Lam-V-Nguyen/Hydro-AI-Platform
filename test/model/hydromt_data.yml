meta:
  root: None

my_hydro:
  uri: data/merit_hydro/{variable}.tif
  driver:
    options: {}
    name: rasterio
  metadata:
    category: hydrology
  data_type: RasterDataset
  root: None

precip:
  uri: data/forcing/precipitation.nc
  data_adapter:
    rename:
      precip: precip
  driver:
    options: {}
    name: raster_xarray
  metadata:
    category: meteo
  data_type: RasterDataset
  root: None

temp:
  uri: data/forcing/temperature.nc
  data_adapter:
    rename:
      temp: temp
  driver:
    options: {}
    name: raster_xarray
  metadata:
    category: meteo
  data_type: RasterDataset
  root: None
