  driver: rasterio
  uri: data/landuse/kc.tif
  metadata:
    category: landuse & landcover
    

lai:
  data_type: RasterDataset
  driver: rasterio
  uri: data/landuse/LAI.tif
  metadata:
    category: landuse & landcover
    

albedo:
  data_type: RasterDataset
  driver: rasterio
  uri: data/landuse/albedo.tif
  metadata:
    category: landuse & landcover
    

manning_n:
  data_type: RasterDataset
  driver: rasterio
  uri: data/landuse/manning_n.tif
  metadata:
    category: landuse & landcover
    

root_depth:
