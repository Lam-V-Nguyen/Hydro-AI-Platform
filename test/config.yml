  metadata:
    category: landuse & landcover
    

# River data
river_width:
  data_type: RasterDataset
  driver: rasterio
  uri: data/river/river_width.tif
  metadata:
    category: river
    

river_depth:
  data_type: RasterDataset
  driver: rasterio
  uri: data/river/river_depth.tif
  metadata:
    category: river
    

river_manning:
  data_type: RasterDataset
  driver: rasterio
  uri: data/river/river_n.tif
