
my_hydro:
  data_type: RasterDataset
  driver: rasterio
  uri: data/merit_hydro/{variable}.tif
  metadata:
    category: hydrology

my_ear5_forcing:
  data_type: RasterDataset
  driver:
    name: raster_xarray
  uri: data/forcing/ear5.nc
  metadata:
    category: meteo




# DTM data
dtm:
  data_type: RasterDataset
  driver: rasterio
  uri: data/dtm/dtm_clipped.tif
  metadata:
    category: topography
    

