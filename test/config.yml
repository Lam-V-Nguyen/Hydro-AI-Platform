    category: river
    

river_mask:
  data_type: RasterDataset
  driver: rasterio
  uri: data/river/river.tif
  metadata:
    category: river
    

# Lookup table
lulc_map:
  data_type: RasterDataset
  driver: rasterio
  uri: data/lookup/land_classes.tif
  metadata:
    category: landuse & landcover

lulc_mapping:
  data_type: DataFrame
  driver: pandas
  uri: data/lookup/lookup_land.csv
  metadata:
    category: observed data

