dtm:
  data_type: RasterDataset
  driver: rasterio
  uri: data/hydro/elevtn.tif
  metadata:
    category: topography

my_hydro:
  data_type: RasterDataset
  driver: rasterio
  uri: data/hydro/{variable}.tif
  metadata:
    category: hydrology

# Forcing data
my_forcing:
  data_type: RasterDataset
  driver: raster_xarray
  uri: data/forcing/my_forcing.nc
  metadata:
    category: meteo

# River data
river_network:
  data_type: GeoDataFrame
  uri: data/river/river.gpkg
  metadata:
    category: river

# Soil data
soilgrids_2020:
  data_type: RasterDataset
  driver: rasterio
  uri: data/soil/{variable}.tif
  metadata:
    category: soil
    url: https://files.isric.org/soilgrids/latest/data/

# Land cover data
corine:
  data_type: RasterDataset
  driver: rasterio
  uri: data/landcover/corine.tif
  metadata:
    category: landuse & landcover
    author: Copernicus / European Environment Agency
    info: landuse parameters based on corine classification for Europe
    resolution: 100m
    url: https://land.copernicus.eu/en/products/corine-land-cover
corine_mapping:
  data_type: DataFrame
  driver: 
    name: pandas
    options:
      index_col: 0
      dtype:
        landuse: int16
        vegetation_kext: float32
        land_manning_n: float32
        soil_compacted_fraction: float32
        vegetation_root_depth: float32
        vegetation_leaf_storage: float32
        vegetation_wood_storage: float32
        land_water_fraction: float32
        vegetation_crop_factor: float32
        vegetation_feddes_alpha_h1: int16
        vegetation_feddes_h1: int16
        vegetation_feddes_h2: int16
        vegetation_feddes_h3_high: int16
        vegetation_feddes_h3_low: int16
        vegetation_feddes_h4: int16
        erosion_usle_c: float32
        Cov_River: float32
  uri: data/landcover/corine.csv
  metadata:
    category: landuse & landcover
    version: 1.0
    legend: https://image.discomap.eea.europa.eu/arcgis/rest/services/Corine/CLC2018_WM/MapServer/legend

esa_worldcover:
  data_type: RasterDataset
  driver: rasterio
  uri: data/landcover/esa_worldcover.tif
  metadata:
    category: landuse & landcover
    info: landuse parameters for the world
    resolution: 10m
    url: https://esa-worldcover.org/en
esa_worldcover_mapping:
  data_type: DataFrame
  driver: 
    name: pandas
    options:
      index_col: 0
      dtype:
        landuse: int16
        vegetation_kext: float32
        land_manning_n: float32
        soil_compacted_fraction: float32
        vegetation_root_depth: float32
        vegetation_leaf_storage: float32
        vegetation_wood_storage: float32
        land_water_fraction: float32
        vegetation_crop_factor: float32
        vegetation_feddes_alpha_h1: int16
        vegetation_feddes_h1: int16
        vegetation_feddes_h2: int16
        vegetation_feddes_h3_high: int16
        vegetation_feddes_h3_low: int16
        vegetation_feddes_h4: int16
        erosion_usle_c: float32
        Cov_River: float32
  uri: data/landcover/esa_worldcover.csv
  metadata:
    category: landuse & landcover
    version: 2021
    legend: https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/docs/WorldCover_PUM_V2.0.pdf