dtm:
  data_type: RasterDataset
  driver: rasterio
  uri: data/hydro/elevtn.tif
  metadata:
    category: topography

my_hydro:
  data_type: RasterDataset
  driver: rasterio
  uri: data/hydro/{variable}.tif
  metadata:
    category: hydrology

# Forcing data
my_forcing:
  data_type: RasterDataset
  driver: raster_xarray
  uri: data/forcing/my_forcing.nc
  metadata:
    category: meteo

# River data
river_network:
  data_type: GeoDataFrame
  uri: data/river/river.gpkg
  metadata:
    category: river

# Soil data
soilgrids_2020:
  data_type: RasterDataset
  driver: rasterio
  uri: data/soil/{variable}.tif
  metadata:
    category: soil

